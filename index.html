<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#050b24;--navy2:#0a1650;--royal:#2f5bea;--sky:#8cc8ff;--white:#f4f8ff;--lav:#b9b3f2;--glow:0 0 28px rgba(80,140,255,.45);
--serif:'Cormorant Garamond',Georgia,serif;--hand:'Caveat','Segoe Script',cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:radial-gradient(ellipse at 50% 0,#12248a 0,var(--navy2) 35%,var(--navy) 100%) fixed;color:var(--white);font:19px/1.7 var(--serif);overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
h1,h2,h3{font-weight:600;line-height:1.15}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn{background:linear-gradient(135deg,var(--royal),#6d8cff);color:#fff;border:0;border-radius:99px;padding:.9rem 2rem;font-size:1.15rem;box-shadow:var(--glow);animation:pulse 3s infinite;transition:transform .3s}
.btn:hover{transform:scale(1.05)}
@keyframes pulse{50%{box-shadow:0 0 48px rgba(120,170,255,.8)}}
#hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;z-index:1;transition:opacity .9s,transform .9s}
#hero.out{opacity:0;transform:scale(1.08);pointer-events:none}
#hero h1{font-size:clamp(2.6rem,10vw,5.8rem);text-shadow:0 0 40px rgba(100,160,255,.7);font-style:italic;animation:rise 1.8s both}
#hero p{max-width:30em;margin:1.2rem 0 2.2rem;color:var(--sky);font-size:1.3rem;animation:rise 1.8s .6s both}
#hero .btn{animation:rise 1.8s 1.2s both,pulse 3s 3s infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
#site{display:none;position:relative;z-index:1;opacity:0;transition:opacity 1.2s}
#site.show{opacity:1}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--sky),var(--lav));box-shadow:var(--glow);z-index:30}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:none;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top));background:rgba(5,11,36,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(140,200,255,.15)}
nav .links{display:flex;gap:1rem;overflow-x:auto;scrollbar-width:none}
nav a{color:var(--sky);text-decoration:none;white-space:nowrap;font-size:1rem;padding:.3rem .2rem}
nav a:hover{color:#fff}
#music{background:rgba(47,91,234,.3);border:1px solid var(--sky);color:#fff;border-radius:50%;width:42px;height:42px;flex:none}
section{padding:5rem 1.2rem 3rem;max-width:1050px;margin:auto}
h2{font-size:clamp(2rem,6vw,3.2rem);text-align:center;margin-bottom:.6rem;text-shadow:0 0 24px rgba(100,160,255,.5)}
.sub{text-align:center;color:var(--lav);margin-bottom:2.5rem;font-style:italic}
.fade{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s}
.fade.in{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.6rem}
.card{background:linear-gradient(160deg,rgba(30,60,170,.35),rgba(10,20,70,.6));border:1px solid rgba(140,200,255,.25);border-radius:24px;padding:.8rem;box-shadow:var(--glow),0 20px 40px rgba(0,0,0,.4);text-align:left;color:inherit;width:100%;transition:transform .4s,box-shadow .4s}
.card:hover,.card:active{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 0 44px rgba(120,170,255,.65),0 24px 44px rgba(0,0,0,.5)}
.ph{aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1b3aa8,#6a5fd0);display:grid;place-items:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:1.3rem;margin:.8rem .3rem .2rem;color:var(--sky)}
.card p{margin:0 .3rem .4rem;font-size:1.05rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl{position:relative;padding-left:2.2rem}
.tl:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(var(--sky),var(--lav),transparent)}
.ch{position:relative;margin-bottom:3rem}
.ch:before{content:"💙";position:absolute;left:-2.55rem;top:0;font-size:1.1rem;filter:drop-shadow(0 0 8px var(--sky))}
.ch .ph{max-width:420px;box-shadow:var(--glow)}
.ch time{color:var(--lav);font-style:italic}
.ch h3{font-size:1.6rem;margin:.2rem 0}
@media(min-width:800px){.tl{padding:0}.tl:before{left:50%}.ch{width:50%;padding:0 2.5rem 0 0;text-align:right}.ch:nth-child(even){margin-left:50%;padding:0 0 0 2.5rem;text-align:left}.ch:before{left:auto;right:-.8rem;}.ch:nth-child(even):before{right:auto;left:-.8rem}.ch .ph{margin-left:auto}.ch:nth-child(even) .ph{margin-left:0}}
.vid{max-width:760px;margin:auto;border-radius:26px;padding:4px;background:linear-gradient(135deg,var(--sky),var(--royal),var(--lav));box-shadow:0 0 50px rgba(90,150,255,.6)}
.vid video{width:100%;display:block;border-radius:23px;background:#000;max-height:80vh}
.vmsg{text-align:center;max-width:36em;margin:1.5rem auto 0;font-size:1.25rem}
.letter{max-width:720px;margin:auto;padding:2.2rem 1.6rem;border-radius:20px;background:linear-gradient(160deg,rgba(244,248,255,.96),rgba(214,226,255,.94));color:#16255e;box-shadow:var(--glow),0 24px 50px rgba(0,0,0,.5);font:1.75rem/1.55 var(--hand);white-space:pre-line;min-height:12em}
.letter .w{opacity:0;transition:opacity .9s}.letter .w.on{opacity:1}
.sig{text-align:right;margin-top:1rem;font-size:2rem}
#final{text-align:center;padding-bottom:7rem}
#final h2{font-style:italic}
#finalMsg{display:none;max-width:30em;margin:2rem auto 0;font-size:1.5rem;padding:1.6rem;border-radius:22px;background:rgba(47,91,234,.2);border:1px solid rgba(140,200,255,.4);box-shadow:var(--glow);white-space:pre-line}
#finalMsg.show{display:block;animation:rise 1.6s both}
#lb{position:fixed;inset:0;z-index:50;background:rgba(3,7,28,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:1rem}
#lb.open{display:flex}
#lb .box{max-width:520px;max-height:94svh;overflow:auto;border-radius:24px;background:#0b1a5e;padding:.8rem;box-shadow:0 0 60px rgba(100,160,255,.7);animation:pop .5s both;text-align:center}
#lb .ph{aspect-ratio:auto;max-height:58svh}
#lb img{max-height:58svh;object-fit:contain}
#lb p{padding:.8rem;font-size:1.2rem}
#lb button{background:none;border:1px solid var(--sky);color:#fff;border-radius:99px;padding:.4rem 1.4rem;margin-bottom:.6rem}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
footer{text-align:center;padding:2rem;color:var(--lav);font-style:italic}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="prog" role="progressbar" aria-label="Scroll progress"></div>

<header id="hero">
  <h1 id="heroTitle"></h1>
  <p id="heroSub"></p>
  <button class="btn" id="open">Open Your Surprise 💙</button>
</header>

<nav id="nav" aria-label="Main">
  <div class="links">
    <a href="#photos">Photos</a><a href="#timeline">Timeline</a><a href="#video">Video</a><a href="#letter">Letter</a><a href="#final">Surprise</a>
  </div>
  <button id="music" aria-label="Play background music" aria-pressed="false">♪</button>
</nav>

<main id="site">
  <section id="photos"><h2>Photo Memories 💙</h2><p class="sub" id="photosSub"></p><div class="grid" id="grid"></div></section>
  <section id="timeline"><h2>Our Memories 💙</h2><p class="sub">Every chapter, with you in it</p><div class="tl" id="tl"></div></section>
  <section id="video"><h2>A Little Something For You 🎥💙</h2><p class="sub">Press play, and turn the volume up</p>
    <div class="vid fade"><video id="vid" controls playsinline preload="metadata" aria-label="Birthday video"></video></div><p class="vmsg fade" id="vmsg"></p></section>
  <section id="letter"><h2>A Message From My Heart 💌</h2><p class="sub">Written just for you</p>
    <div class="letter fade" id="letterBox"><div id="letterText"></div><div class="sig" id="sig"></div></div></section>
  <section id="final"><h2>And this is only the beginning... 💙</h2>
    <button class="btn" id="more" style="margin-top:1.5rem">One More Surprise 💙</button>
    <div id="finalMsg" role="status"></div></section>
  <footer id="foot"></footer>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Memory"><div class="box"><div class="ph" id="lbPh"></div><p id="lbTxt"></p><button id="lbClose">Close 💙</button></div></div>
<audio id="aud" loop preload="none"></audio>

<script>
/* =========================================================
   ✏️ EDIT EVERYTHING HERE — this is the only part you need to change.
   Put your files in the same folder as this index.html.
   ========================================================= */
const CONFIG = {
  herName: "Marceline",                 // her name (shown in the title and letter)
  myName: "hanz",                // your name (signature)
  heroSubtitle: "Every day with you is a gift. Today, I get to celebrate the one who makes my world brighter.",
  photosSubtitle: "Tap any photo to open it a little closer",
  music: "song.mp3",
  video: "video.mp4",
  videoMessage: "I made this for you, my love. I hope it makes you smile as much as you make me smile every day. 💙",
  letter: "Hi baby, \n\n it’s your day! Another year of blessings, and I hope you are happy on your special day. \n\nNo stress, no overthinking, just be happy lang and enjoy your day. You deserve all the good things coming your way.\n\nMy wish for you is to succeed in life and continue to thrive as a person. I’m just here to support you as your friend, your man, and soon to be your husband. \nGrabe, advance mag isip, pero yun nga, I’m really happy and grateful to have you in my life.\n\nThank you for everything you’ve done for me. Thank you for being my support system whenever I feel sad, overwhelmed, or stressed sa acads. \nThank you for always listening to me kahit minsan magulo ako kausap. \nYou’ve been there for me in ways you probably don’t even realize, and I really appreciate you for that.",
  finalTitle: "I love my beautiful girl. Happy birthday, baby.💙",
  finalMessage: "Whatever comes next, I want to share it with you.\nHappy birthday, my favorite person.",
  // SECTION 1 — HER photos (Photo Memories gallery). Add, remove, or reorder freely.
  herPhotos: [
    {photo:"cute.jpeg", date:"Beautiful you", title:"Cutest girl",      message:"This is what I have as my wallpaper the cutest picture ever.  Every time I look at my phone, I get reminded of you and this cute little moment. Honestly, I never get tired of seeing this picture. It’s just too cute not to keep as my wallpaper."},
    {photo:"anaze.jpg", date:"Proud", title:"My future", message:"This picture amazes me the most because even though you’re a working student this time , you still look so good, parang walang stress at all.I honestly admire how you still manage to look happy and beautiful despite being pagod."},
    {photo:"jelos.jpg", date:"AKIN YAAAAAAN", title:"JELOSI",       message:"Cute mo sa pic nato, pero nag jejelosi  kay Shrek 😭 Like, bakit kailangan mo pang maging cute habang kasama siya? AKIN YAN AKIN YAN HAHAHA"}
  ],
  // SECTION 2 — MY photos (Our Memories timeline). Oldest first.
  myPhotos: [
    {photo:"flower.jpg", date:"HAPPY B", title:"FLOWER FOR YOU", message:`This flower is for you, baby. A little something for my beautiful girl.

This flower is for you, because you deserve something beautiful on your special day.

For you, baby. Just a little flower for the girl who makes my days more beautiful.

A flower for my beautiful girl. I hope this makes your day a little more special.

This one is for you, baby. I may not be there to give it to you personally yet, but I hope you can feel how much I care for you.

For you, my beautiful girl. I hope this flower reminds you how special you are to me.`},
    {photo:"together.jpeg", date:"A sweet day",   title:"Just me and you",      message:"This is my favorite picture in my gallery because it captured one of our sweetest moments together. Eto yung isa sa pinaka masayang araw ko nakasama kita gumala, kumain, and most especially, yung matagal nating interaction together. Simple lang yung araw na yun, pero sobrang special siya sa akin. Kaya hanggang ngayon, isa pa rinto sa mga favorite pictures ko. "},
    {photo:"rene.jpg", date:"renen", title:"HAHAHAHA", message:`And lastly, I just want you to know that no matter what happens, I’ll always be here for you. I’ll continue to support you, listen to you, and be someone you can always count on. I hope you know how special you are to me and how grateful I am that you came into my life. I may not be able to give you everything right now, but I promise that I’ll always do my best to make you feel loved and appreciated. Happy birthday again, baby. I love you, my beautiful girl.`}
  ]
};
/* ========================================================= */

const $=s=>document.querySelector(s), esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const C=CONFIG;

$('#heroTitle').textContent="Happy Birthday, "+C.herName+" 💙";
$('#heroSub').textContent=C.heroSubtitle;
$('#photosSub').textContent=C.photosSubtitle;
$('#vmsg').textContent=C.videoMessage;
$('#sig').textContent="Forever yours, "+C.myName+" 💙";
$('#foot').textContent="Made with love by "+C.myName+", for "+C.herName+" 💙";
$('#finalMsg').innerHTML="<strong>"+esc(C.finalTitle)+"</strong><br><br>"+esc(C.finalMessage);
$('#vid').src=C.video; $('#aud').src=C.music;

function photo(m){return `<div class="ph"><img src="${esc(m.photo)}" alt="${esc(m.title||'Our memory')}" loading="lazy" onerror="this.parentNode.textContent='💙'"></div>`}
C.herPhotos.forEach((m,i)=>{
  const b=document.createElement('button');b.className='card fade';b.style.transitionDelay=(i%3)*.12+'s';
  b.setAttribute('aria-label','Open memory: '+(m.title||m.date));
  b.innerHTML=photo(m)+`<h3>${esc(m.title||'')}</h3><p>${esc(m.message)}</p>`;
  b.onclick=()=>{$('#lbPh').innerHTML=photo(m);$('#lbTxt').innerHTML=`<em>${esc(m.date||'')}</em><br>${esc(m.message)}`;$('#lb').classList.add('open');$('#lbClose').focus()};
  $('#grid').appendChild(b);
});
C.myPhotos.forEach(m=>{
  const c=document.createElement('article');c.className='ch fade';
  c.innerHTML=photo(m)+`<time>${esc(m.date||'')}</time><h3>${esc(m.title||'')}</h3><p>${esc(m.message)}</p>`;
  $('#tl').appendChild(c);
});
const closeLb=()=>$('#lb').classList.remove('open');
$('#lbClose').onclick=closeLb;$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});

/* open surprise */
$('#open').onclick=()=>{
  $('#hero').classList.add('out');
  $('#site').style.display='block';$('#nav').style.display='flex';
  setTimeout(()=>{$('#site').classList.add('show');scrollTo({top:0,behavior:'instant'});observe();burst(60)},700);
  setTimeout(()=>{$('#hero').style.display='none'},900);
};

/* scroll reveal + letter typing */
let typed=false;
function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;e.target.classList.add('in');
    if(e.target.id==='letterBox'&&!typed){typed=true;typeLetter()}
    io.unobserve(e.target)}),{threshold:.2});
  document.querySelectorAll('.fade').forEach(el=>io.observe(el));
}
function typeLetter(){
  const t=$('#letterText');t.innerHTML='';
  const words=C.letter.split(/(\s+)/).map(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;t.appendChild(s);return s});
  words.forEach((s,i)=>setTimeout(()=>s.classList.add('on'),reduce?0:i*90));
}
/* progress */
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
/* music (never autoplays) */
$('#music').onclick=function(){const a=$('#aud');
  if(a.paused){a.volume=.5;a.play().then(()=>{this.textContent='❚❚';this.setAttribute('aria-pressed','true');this.setAttribute('aria-label','Pause background music')}).catch(()=>alert('Add background-music.mp3 next to index.html'))}
  else{a.pause();this.textContent='♪';this.setAttribute('aria-pressed','false');this.setAttribute('aria-label','Play background music')}};
/* final surprise */
$('#more').onclick=()=>{burst(220);setTimeout(()=>burst(140),500);$('#finalMsg').classList.add('show');$('#finalMsg').scrollIntoView({behavior:'smooth',block:'center'})};

/* canvas: stars, floating hearts, bursts */
const cv=$('#fx'),x=cv.getContext('2d');let W,H,stars=[],hearts=[],parts=[];
function size(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;
  stars=Array.from({length:Math.min(110,W/6)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6}))}
addEventListener('resize',size);size();
const cols=['#8cc8ff','#2f5bea','#b9b3f2','#f4f8ff'];
function heart(px,py,s,col,a){x.save();x.globalAlpha=a;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=14;x.translate(px,py);x.scale(s,s);x.beginPath();x.moveTo(0,.3);x.bezierCurveTo(-1,-.5,-.5,-1,0,-.4);x.bezierCurveTo(.5,-1,1,-.5,0,.3);x.fill();x.restore()}
function burst(n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*7+2;parts.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,h:Math.random()<.5,s:Math.random()*12+6,c:cols[i%4]})}}
let t=0;
function loop(){t+=.02;x.clearRect(0,0,W,H);
  stars.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t+s.p));x.fillStyle='#dbe8ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()});
  if(!reduce&&Math.random()<.025&&hearts.length<14)hearts.push({x:Math.random()*W,y:H+20,s:Math.random()*8+5,v:Math.random()*.5+.3,c:cols[Math.random()*4|0],p:Math.random()*6});
  hearts=hearts.filter(h=>h.y>-30);hearts.forEach(h=>{h.y-=h.v;heart(h.x+Math.sin(t+h.p)*18,h.y,h.s,h.c,.35)});
  parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.01;p.h?heart(p.x,p.y,p.s,p.c,p.l):(x.globalAlpha=p.l,x.fillStyle=p.c,x.shadowColor=p.c,x.shadowBlur=10,x.fillRect(p.x,p.y,3,3))});
  x.globalAlpha=1;x.shadowBlur=0;requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
